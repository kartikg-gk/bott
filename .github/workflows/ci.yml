name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest version package.json allows, and the current long-term release.
        node: ["22", "lts/*"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        # Tests that need Docker images, live keys or a POSIX shell skip themselves.
        run: npm test

      - name: Lint
        run: npx biome check $(git ls-files '*.ts' '*.json' | grep -v package-lock)

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
